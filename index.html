<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CraftRadar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #050805;
  --card: #0f140f;
  --card2: #161d16;
  --accent: #00e5c8;
  --green: #7dff6a;
  --text: #e8f0e4;
  --muted: #8a9a82;
  --border: rgba(0,229,200,0.15);
  --red: #ff5c5c;
  --gold: #ffd166;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: radial-gradient(ellipse 90% 60% at 50% -30%, rgba(0,229,200,0.08), transparent);
}
.header {
  padding: 28px 16px 20px;
  text-align: center;
}
.logo {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  box-shadow: 0 0 0 5px rgba(0,229,200,0.12), 0 0 32px rgba(0,229,200,0.25);
  margin: 0 auto 14px;
  display: block;
  object-fit: cover;
}
h1 {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(90deg, #fff, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.sub {
  font-size: 11px;
  color: var(--green);
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
  max-width: 460px;
  margin: 0 auto 20px;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 16px;
  min-width: 78px;
  text-align: center;
}
.stat b {
  display: block;
  font-size: 18px;
  color: var(--green);
  font-weight: 800;
}
.stat span {
  font-size: 11px;
  color: var(--muted);
}
.nav {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5,8,5,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.nav button {
  flex-shrink: 0;
  padding: 9px 16px;
  border-radius: 40px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.nav button.active {
  background: rgba(0,229,200,0.15);
  color: var(--accent);
  border-color: var(--accent);
}
.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
.panel { display: none; }
.panel.active { display: block; }
.toolbar { margin-bottom: 14px; }
.search {
  width: 100%;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 10px;
}
.search:focus { outline: none; border-color: var(--accent); }
.filters {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.filters button {
  padding: 7px 13px;
  border-radius: 30px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.filters button.on {
  background: rgba(0,229,200,0.12);
  color: var(--accent);
  border-color: var(--accent);
}
.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.actions button {
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}
.actions button:disabled { opacity: 0.5; }
.count { font-size: 12px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 11px; }
.server {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  transition: 0.2s;
}
.server:hover {
  border-color: rgba(0,229,200,0.4);
}
.s-top {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 10px;
}
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  color: #050805;
  flex-shrink: 0;
}
.info { flex: 1; min-width: 0; }
.info h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid;
}
.tag.t { background: rgba(0,229,200,0.1); color: var(--accent); border-color: rgba(0,229,200,0.3); }
.tag.c { background: rgba(255,92,92,0.1); color: #ff8a8a; border-color: rgba(255,92,92,0.3); }
.tag.p { background: rgba(255,209,102,0.1); color: var(--gold); border-color: rgba(255,209,102,0.3); }
.tag.v { background: rgba(125,255,106,0.1); color: var(--green); border-color: rgba(125,255,106,0.3); }
.ip {
  direction: ltr;
  text-align: left;
  background: #0a0e0a;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: monospace;
  font-size: 13px;
  color: var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  margin-bottom: 8px;
}
.ip:hover { border-color: var(--accent); }
.ip span {
  font-family: 'Vazirmatn';
  font-size: 11px;
  color: var(--muted);
}
.modes {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 10px;
}
.btns {
  display: flex;
  gap: 8px;
}
.btns button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}
.btns button:disabled { opacity: 0.45; }
.btns .st { border-color: rgba(0,229,200,0.4); color: var(--accent); }
.btns .vt { border-color: rgba(125,255,106,0.4); color: var(--green); background: rgba(125,255,106,0.06); }
.status {
  background: #0a0e0a;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12.5px;
  display: none;
  margin-top: 10px;
}
.status.open { display: block; }
.row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}
.row .k { color: var(--muted); }
.row .v { font-family: monospace; direction: ltr; }
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-left: 5px;
}
.dot.g { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.r { background: var(--red); }
.dot.y { background: var(--gold); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.rank {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}
.rank:hover { border-color: var(--accent); }
.num {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: rgba(0,229,200,0.15);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}
.rank .n { flex: 1; font-weight: 700; font-size: 14px; }
.rank .c { color: var(--accent); font-size: 12.5px; }
.empty {
  text-align: center;
  padding: 36px 16px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 14px;
  color: var(--muted);
  line-height: 1.9;
}
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--green);
  color: #050805;
  padding: 11px 22px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 13.5px;
  opacity: 0;
  transition: 0.25s;
  z-index: 50;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.footer {
  text-align: center;
  padding: 28px 14px;
  font-size: 12px;
  color: var(--muted);
  opacity: 0.75;
}
@media (max-width: 480px) {
  .stat { min-width: 70px; padding: 9px 11px; }
  .logo { width: 72px; height: 72px; }
  h1 { font-size: 23px; }
}
</style>
</head>
<body>
<div class="header">
  <img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAIAAABt+uBvAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+viUYcLcKakFicD6Q9ArFIEtBxopAiQLZIOYWuA2EkQtg2IXV5SUAJkB4DYRSFBzkB2ppg2zuoLPxnjSsYQ1r2HTtvwwrW2GEVu96AAAAAElFTkSuQmCC" alt="CraftRadar">
  <h1>CraftRadar</h1>
  <div class="sub">SINCE 2026</div>
  <p class="desc">رادار سرورهای ماینکرفت ایرانی و خارجی با وضعیت زنده، تعداد بازیکن، آی‌پی و رأی‌گیری</p>
  <div class="stats">
    <div class="stat"><b id="stat-total">۰</b><span>کل</span></div>

  <div class="panel" id="panel-foreign">
    <div class="toolbar">

      <div class="filters" id="filter-foreign">
        <button class="on" data-val="all">همه</button>

  </div>

  <div class="footer">ساخته‌شده در ۲۰۲۶ • اطلاعات محفوظ است</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {

      { n: "LightMC", ip: "play.lightmc.ir", t: "java", m: "Survival, SkyBlock, Minigames" },
      { n: "MineHeaven", ip: "mc.mineheaven.ir", t: "both", m: "Survival, SkyBlock, BedWars" },
      { n: "HelixGame", ip: "play.helixgame.ir", t: "java", m: "Custom Modes, Low Ping" },

      { n: "BitCraft", ip: "play.bitcraft.ir", t: "java", m: "BedWars, Minigames" }
    ],
    foreign: [
      { n: "Hypixel", ip: "mc.hypixel.net", t: "java", a: "premium", m: "BedWars, SkyBlock, SkyWars, Murder Mystery" },
      { n: "Wynncraft", ip: "play.wynncraft.com", t: "java", a: "premium", m: "MMORPG, Quests, Leveling" },
      { n: "CubeCraft", ip: "play.cubecraft.net", t: "both", a: "premium", m: "SkyWars, EggWars, Lucky Islands" },
      { n: "Pika Network", ip: "play.pika-network.net", t: "both", a: "cracked", m: "BedWars, SkyBlock, Factions, Lifesteal" },
      { n: "JartexNetwork", ip: "play.jartexnetwork.com", t: "java", a: "cracked", m: "BedWars, SkyWars, Prison, SkyBlock" },
      { n: "6b6t", ip: "play.6b6t.org", t: "java", a: "cracked", m: "Anarchy, Survival, PvP" },
      { n: "MineBerry", ip: "mc.mineberry.org", t: "java", a: "cracked", m: "Survival, Anarchy, Economy, KitPvP" },
      { n: "HylexMC", ip: "play.hylexmc.net", t: "java", a: "cracked", m: "BedWars, Lifesteal, OneBlock, Parkour" },
      { n: "AppleMC", ip: "play.applemc.fun", t: "java", a: "cracked", m: "Survival, BedWars, Earth, Lifesteal" },
      { n: "UltimisMC", ip: "play.ultimismc.com", t: "java", a: "cracked", m: "Survival, BedWars, Lifesteal, OneBlock" },
      { n: "LifestealSMP", ip: "play.lifestealsmp.com", t: "java", a: "cracked", m: "Survival, Lifesteal, Earth, Factions" },
      { n: "OneBlocky", ip: "play.oneblocky.com", t: "java", a: "cracked", m: "OneBlock, SkyBlock, Survival" },
      { n: "Purple Prison", ip: "play.purpleprison.org", t: "java", a: "cracked", m: "Prison, Economy, Mining" },
      { n: "Twerion", ip: "twerion.net", t: "java", a: "cracked", m: "BedWars, SkyBlock, PvP, CityBuild" },
      { n: "MineMatrix", ip: "minematrix.lol", t: "java", a: "cracked", m: "Survival, Skyblock, KitPvP, Lifesteal" },
      { n: "DonutSMP", ip: "play.donutsmp.net", t: "java", a: "cracked", m: "Survival, Economy, Claims" },
      { n: "ZenPvP", ip: "play.zenpvp.net", t: "java", a: "cracked", m: "Gens, Skyblock, Dungeons, Prison" },
      { n: "Minecadia", ip: "play.minecadia.com", t: "java", a: "cracked", m: "Factions, Kitmap, McMMO" },
      { n: "Rtrix", ip: "play.rtrix.gg", t: "java", a: "cracked", m: "Practice, Lifesteal SMP" },
      { n: "Aeon Network", ip: "aeon-network.net", t: "java", a: "cracked", m: "Survival, Realms, Pitfall" }
    ]
  };

  var COLORS = ["#00e5c8", "#7dff6a", "#ffd166", "#ff5c5c", "#b388ff", "#4fc3f7"];

  function avatar(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    var letters = name.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase();
    if (!letters) letters = "MC";
    return { color: COLORS[sum % COLORS.length], letters: letters };
  }

  function toFa(n) {
    return String(n).replace(/[0-9]/g, function (d) {
      return "۰۱۲۳۴۵۶۷۸۹"[d];
    });
  }

  function typeLabel(t) {
    if (t === "java") return "Java";
    if (t === "bedrock") return "Bedrock";
    return "Java+Bedrock";
  }

  var votes = {};
  var voted = [];

  async function loadVotes() {
    try {
      var v = await window.storage.get("cr-votes", true);
      votes = (v && v.value) ? JSON.parse(v.value) : {};
    } catch (e) { votes = {}; }
    try {
      var m = await window.storage.get("cr-voted", false);
      voted = (m && m.value) ? JSON.parse(m.value) : [];
    } catch (e) { voted = []; }
  }

  function getVotes(name) { return votes[name] || 0; }
  function hasVoted(name) { return voted.indexOf(name) !== -1; }

  async function addVote(name) {
    if (hasVoted(name)) return null;
    votes[name] = (votes[name] || 0) + 1;
    voted.push(name);
    try { await window.storage.set("cr-votes", JSON.stringify(votes), true); } catch (e) {}
    try { await window.storage.set("cr-voted", JSON.stringify(voted), false); } catch (e) {}
    return votes[name];
  }

  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("show");
    }, 1600);
  }

  function copyIp(ip) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(ip).catch(function () {});
    }
    showToast("کپی شد: " + ip);
  }

  var onlineStat = { online: 0, checked: 0 };
  function bumpOnline(isOnline) {
    onlineStat.checked++;
    if (isOnline) onlineStat.online++;
    document.getElementById("stat-online").textContent = toFa(onlineStat.online) + "/" + toFa(onlineStat.checked);
  }

  function fetchWithTimeout(url, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms || 7000);
    return fetch(url, { signal: controller.signal }).finally(function () {
      clearTimeout(timer);
    });
  }

  function readVersion(data) {
    if (!data) return "?";
    if (typeof data.version === "string") return data.version;
    if (data.version && data.version.name) return data.version.name;
    return "?";
  }

  function paintStatus(box, state, info) {
    box.classList.add("open");
    if (state === "checking") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot y"></span>در حال بررسی...</span></div>';
      return;
    }
    if (state === "error") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot r"></span>خطا در اتصال</span></div>';
      return;
    }
    if (state === "offline") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot r"></span>آفلاین</span></div>';
      return;

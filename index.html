<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CraftRadar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0b0f0c;
  --card: #121a14;
  --card2: #1a241c;
  --accent: #22c55e;
  --accent2: #4ade80;
  --text: #f0fdf4;
  --muted: #86a Pan;
  --border: rgba(34,197,94,0.18);
  --red: #ef4444;
  --gold: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,197,94,0.12), transparent);
}

.header {
  padding: 32px 16px 24px;
  text-align: center;
}

.logo-circle {
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(135deg, #166534, #22c55e);
  border: 3px solid #4ade80;
  box-shadow: 0 0 0 6px rgba(34,197,94,0.15), 0 0 30px rgba(34,197,94,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: white;
}

h1 {
  font-size: 28px;
  font-weight: 800;
  color: #4ade80;
  margin-bottom: 4px;
}

.sub {
  font-size: 12px;
  color: #86efac;
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.desc {
  font-size: 13.5px;
  color: #a3b8a8;
  line-height: 1.8;
  max-width: 440px;
  margin: 0 auto 22px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 18px;
  min-width: 82px;
  text-align: center;
}

.stat b {
  display: block;
  font-size: 20px;
  color: #4ade80;
  font-weight: 800;
}

.stat span {
  font-size: 11px;
  color: #86a;
}

.nav {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(11,15,12,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.nav button {
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 40px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #86a;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}

.nav button.active {
  background: rgba(34,197,94,0.18);
  color: #4ade80;
  border-color: #22c55e;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 18px 14px 50px;
}

.panel { display: none; }
.panel.active { display: block; }

.toolbar { margin-bottom: 16px; }

.search {
  width: 100%;
  padding: 13px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 12px;
}

.search:focus {
  outline: none;
  border-color: #22c55e;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.filters button {
  padding: 8px 14px;
  border-radius: 30px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #86a;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}

.filters button.on {
  background: rgba(34,197,94,0.15);
  color: #4ade80;
  border-color: #22c55e;
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.actions button {
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.actions button:disabled { opacity: 0.5; }

.count { font-size: 12.5px; color: #86a; }

.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.server {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 15px;
}

.server:hover {
  border-color: rgba(34,197,94,0.4);
}

.s-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 11px;
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 15px;
  color: #0b0f0c;
  flex-shrink: 0;
}

.info { flex: 1; min-width: 0; }

.info h3 {
  font-size: 15.5px;
  font-weight: 700;
  margin-bottom: 5px;
}

.tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 7px;
  border: 1px solid;
}

.tag.t { background: rgba(34,197,94,0.12); color: #4ade80; border-color: rgba(34,197,94,0.3); }
.tag.c { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
.tag.p { background: rgba(251,191,36,0.12); color: #fcd34d; border-color: rgba(251,191,36,0.3); }
.tag.v { background: rgba(74,222,128,0.12); color: #86efac; border-color: rgba(74,222,128,0.3); }

.ip {
  direction: ltr;
  text-align: left;
  background: #0a100c;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 13px;
  font-family: monospace;
  font-size: 13.5px;
  color: #4ade80;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  margin-bottom: 9px;
}

.ip:hover { border-color: #22c55e; }

.ip span {
  font-family: 'Vazirmatn';
  font-size: 11px;
  color: #86a;
}

.modes {
  font-size: 12.5px;
  color: #86a;
  line-height: 1.65;
  margin-bottom: 11px;
}

.btns {
  display: flex;
  gap: 9px;
}

.btns button {
  flex: 1;
  padding: 11px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.btns button:disabled { opacity: 0.45; }

.btns .st { border-color: rgba(34,197,94,0.4); color: #4ade80; }
.btns .vt { border-color: rgba(74,222,128,0.4); color: #86efac; background: rgba(74,222,128,0.07); }

.status {
  background: #0a100c;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 13px;
  font-size: 13px;
  display: none;
  margin-top: 11px;
}

.status.open { display: block; }

.row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}

.row .k { color: #86a; }
.row .v { font-family: monospace; direction: ltr; }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-left: 6px;
}

.dot.g { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
.dot.r { background: #ef4444; }
.dot.y { background: #fbbf24; animation: pulse 1s infinite; }

@keyframes pulse {
  50% { opacity: 0.35; }
}

.rank {
  display: flex;
  align-items: center;
  gap: 13px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 13px 15px;
}

.rank:hover { border-color: #22c55e; }

.num {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(34,197,94,0.18);
  color: #4ade80;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13.5px;
  flex-shrink: 0;
}

.rank .n { flex: 1; font-weight: 700; font-size: 14.5px; }
.rank .c { color: #4ade80; font-size: 13px; }

.empty {
  text-align: center;
  padding: 40px 18px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 15px;
  color: #86a;
  line-height: 1.9;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #22c55e;
  color: #0b0f0c;
  padding: 12px 24px;
  border-radius: 13px;
  font-weight: 800;
  font-size: 14px;
  opacity: 0;
  transition: 0.25s;
  z-index: 100;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.footer {
  text-align: center;
  padding: 30px 14px;
  font-size: 12.5px;
  color: #86a;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-circle">CR</div>
  <h1>CraftRadar</h1>
  <div class="sub">SINCE 2026</div>
  <p class="desc">رادار سرورهای ماینکرفت ایرانی و خارجی با وضعیت زنده، تعداد بازیکن، آی‌پی و رأی‌گیری</p>
  <div class="stats">
    <div class="stat"><b id="stat-total">۰</b><span>کل</span></div>
    <div class="stat"><b id="stat-iran">۰</b><span>ایرانی</span></div>
    <div class="stat"><b id="stat-foreign">۰</b><span>خارجی</span></div>
    <div class="stat"><b id="stat-online">؟</b><span>آنلاین</span></div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="active" data-panel="iran">🇮🇷 ایرانی</button>
  <button data-panel="foreign">🌍 خارجی</button>
  <button data-panel="top">🏆 برترین‌ها</button>
</div>

<div class="container">
  <div class="panel active" id="panel-iran">
    <div class="toolbar">
      <input class="search" id="search-iran" placeholder="جستجوی سرور ایرانی...">
      <div class="filters" id="filter-iran">
        <button class="on" data-val="all">همه</button>
        <button data-val="java">جاوا</button>
        <button data-val="bedrock">بدراک</button>
      </div>
      <div class="actions">
        <button id="check-iran">📡 بررسی همه</button>
        <span class="count" id="count-iran"></span>
      </div>
    </div>
    <div class="list" id="list-iran"></div>
  </div>

  <div class="panel" id="panel-foreign">
    <div class="toolbar">
      <input class="search" id="search-foreign" placeholder="جستجوی سرور خارجی...">
      <div class="filters" id="filter-foreign">
        <button class="on" data-val="all">همه</button>
        <button data-val="cracked">کرک</button>
        <button data-val="premium">پرمیوم</button>
      </div>
      <div class="actions">
        <button id="check-foreign">📡 بررسی همه</button>
        <span class="count" id="count-foreign"></span>
      </div>
    </div>
    <div class="list" id="list-foreign"></div>
  </div>

  <div class="panel" id="panel-top">
    <div class="list" id="list-top"></div>
  </div>

  <div class="footer">ساخته‌شده در ۲۰۲۶ • اطلاعات محفوظ است</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ========== DATA ==========
  var DATA = {
    iran: [
      {n:"GunMax", ip:"play.gunmax.org", t:"java", m:"Survival, Roleplay, SkyMine, BedWars"},
      {n:"GameUp", ip:"mc.gameup.ir", t:"java", m:"Survival, SkyBlock, BedWars, Creative, Economy"},
      {n:"TrexMine", ip:"play.trexmine.com", t:"java", m:"Survival, SkyBlock, BedWars, PvP, Minigames"},
      {n:"Xcraft", ip:"play.xcraft.ir", t:"java", m:"Survival, SMP, SkyBlock, Practice, Parkour, Creative"},
      {n:"IranMinecraft", ip:"play.iranminecraft.com", t:"java", m:"Survival, SkyBlock, Economy, Minigames"},
      {n:"RexoCraft", ip:"play.rexocraft.com", t:"java", m:"BedWars, Survival, SkyMine, SkyBlock, Arcade"},
      {n:"MagicPixel", ip:"play.magicpixel.ir", t:"java", m:"Roleplay, RPG, SkyMine, SMP"},
      {n:"InfinityStar", ip:"play.infinitystar.ir", t:"java", m:"Roleplay, Survival, SMP"},
      {n:"HorizonNetwork", ip:"play.horizonnetwork.ir", t:"java", m:"SkyMine, SMP, ThePit, Survival"},
      {n:"LunarProCraft", ip:"play.lunarprocraft.ir", t:"java", m:"OneBlock, Minigames, BedWars"},
      {n:"ArianCraft", ip:"play.svariancraft.ir", t:"java", m:"BedWars, OneBlock, SkyBlock, Survival, Parkour"},
      {n:"SUSIS MC", ip:"play.susismc.ir", t:"java", m:"Survival, SMP, Anarchy, Zombie"},
      {n:"VoidShot", ip:"play.voidshot.ir", t:"java", m:"Roleplay, BedWars, SkyBlock, Survival"},
      {n:"PaladinGuard", ip:"java.paladinguard.ir", t:"both", m:"Survival, Roleplay, SMP + Bedrock"},
      {n:"PandaSMP", ip:"play.pandasmp.ir", t:"java", m:"Lifesteal, SMP, Anarchy"},
      {n:"ColdGame", ip:"play.coldgame.ir", t:"java", m:"Survival, SlimeFun, SkyMine, Practice"},
      {n:"RubyLand", ip:"play.mcbe.ir", t:"bedrock", m:"Bedrock Survival, Economy, Roleplay"},
      {n:"LegendCraft", ip:"play.legendcraft.ir", t:"java", m:"Earth SMP, Fun, Ranks"},
      {n:"NeoCraft", ip:"play.neocraft.ir", t:"java", m:"BedWars, Economy, McMMO"},
      {n:"PeakCraft", ip:"play.peakcraft.ir", t:"java", m:"Roleplay, Survival"},
      {n:"LightMC", ip:"play.lightmc.ir", t:"java", m:"Survival, SkyBlock, Minigames"},
      {n:"MineHeaven", ip:"mc.mineheaven.ir", t:"both", m:"Survival, SkyBlock, BedWars"},
      {n:"HelixGame", ip:"play.helixgame.ir", t:"java", m:"Custom Modes, Low Ping"},
      {n:"ASTO MC", ip:"play.astomc.ir", t:"java", m:"Anarchy, Free Build"},
      {n:"BitCraft", ip:"play.bitcraft.ir", t:"java", m:"BedWars, Minigames"}
    ],
    foreign: [
      {n:"Hypixel", ip:"mc.hypixel.net", t:"java", a:"premium", m:"BedWars, SkyBlock, SkyWars, Murder Mystery"},
      {n:"Wynncraft", ip:"play.wynncraft.com", t:"java", a:"premium", m:"MMORPG, Quests, Leveling"},
      {n:"CubeCraft", ip:"play.cubecraft.net", t:"both", a:"premium", m:"SkyWars, EggWars, Lucky Islands"},
      {n:"Pika Network", ip:"play.pika-network.net", t:"both", a:"cracked", m:"BedWars, SkyBlock, Factions, Lifesteal"},
      {n:"JartexNetwork", ip:"play.jartexnetwork.com", t:"java", a:"cracked", m:"BedWars, SkyWars, Prison, SkyBlock"},
      {n:"6b6t", ip:"play.6b6t.org", t:"java", a:"cracked", m:"Anarchy, Survival, PvP"},
      {n:"MineBerry", ip:"mc.mineberry.org", t:"java", a:"cracked", m:"Survival, Anarchy, Economy, KitPvP"},
      {n:"HylexMC", ip:"play.hylexmc.net", t:"java", a:"cracked", m:"BedWars, Lifesteal, OneBlock, Parkour"},
      {n:"AppleMC", ip:"play.applemc.fun", t:"java", a:"cracked", m:"Survival, BedWars, Earth, Lifesteal"},
      {n:"UltimisMC", ip:"play.ultimismc.com", t:"java", a:"cracked", m:"Survival, BedWars, Lifesteal, OneBlock"},
      {n:"LifestealSMP", ip:"play.lifestealsmp.com", t:"java", a:"cracked", m:"Survival, Lifesteal, Earth, Factions"},
      {n:"OneBlocky", ip:"play.oneblocky.com", t:"java", a:"cracked", m:"OneBlock, SkyBlock, Survival"},
      {n:"Purple Prison", ip:"play.purpleprison.org", t:"java", a:"cracked", m:"Prison, Economy, Mining"},
      {n:"Twerion", ip:"twerion.net", t:"java", a:"cracked", m:"BedWars, SkyBlock, PvP, CityBuild"},
      {n:"MineMatrix", ip:"minematrix.lol", t:"java", a:"cracked", m:"Survival, Skyblock, KitPvP, Lifesteal"},
      {n:"DonutSMP", ip:"play.donutsmp.net", t:"java", a:"cracked", m:"Survival, Economy, Claims"},
      {n:"ZenPvP", ip:"play.zenpvp.net", t:"java", a:"cracked", m:"Gens, Skyblock, Dungeons, Prison"},
      {n:"Minecadia", ip:"play.minecadia.com", t:"java", a:"cracked", m:"Factions, Kitmap, McMMO"},
      {n:"Rtrix", ip:"play.rtrix.gg", t:"java", a:"cracked", m:"Practice, Lifesteal SMP"},
      {n:"Aeon Network", ip:"aeon-network.net", t:"java", a:"cracked", m:"Survival, Realms, Pitfall"}
    ]
  };

  var COLORS = ["#22c55e","#4ade80","#fbbf24","#ef4444","#a78bfa","#38bdf8"];

  function avatar(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    var letters = name.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase();
    if (!letters) letters = "MC";
    return { color: COLORS[sum % COLORS.length], letters: letters };
  }

  function toFa(n) {
    return String(n).replace(/[0-9]/g, function(d) {
      return "۰۱۲۳۴۵۶۷۸۹"[d];
    });
  }

  function typeLabel(t) {
    if (t === "java") return "Java";
    if (t === "bedrock") return "Bedrock";
    return "Java+Bedrock";
  }

  // ========== VOTES (localStorage) ==========
  var votes = {};
  var voted = [];

  function loadVotes() {
    try {
      var v = localStorage.getItem("craftradar_votes");
      votes = v ? JSON.parse(v) : {};
    } catch(e) { votes = {}; }
    try {
      var m = localStorage.getItem("craftradar_voted");
      voted = m ? JSON.parse(m) : [];
    } catch(e) { voted = []; }
  }

  function getVotes(name) { return votes[name] || 0; }
  function hasVoted(name) { return voted.indexOf(name) !== -1; }

  function addVote(name) {
    if (hasVoted(name)) return null;
    votes[name] = (votes[name] || 0) + 1;
    voted.push(name);
    try { localStorage.setItem("craftradar_votes", JSON.stringify(votes)); } catch(e) {}
    try { localStorage.setItem("craftradar_voted", JSON.stringify(voted)); } catch(e) {}
    return votes[name];
  }

  // ========== TOAST ==========
  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      el.classList.remove("show");
    }, 1600);
  }

  function copyIp(ip) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(ip).catch(function(){});
    }
    showToast("کپی شد: " + ip);
  }

  // ========== ONLINE STAT ==========
  var onlineStat = { online: 0, checked: 0 };
  function bumpOnline(isOnline) {
    onlineStat.checked++;
    if (isOnline) onlineStat.online++;
    document.getElementById("stat-online").textContent = toFa(onlineStat.online) + "/" + toFa(onlineStat.checked);
  }

  // ========== STATUS CHECK ==========
  function fetchWithTimeout(url, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms || 7000);
    return fetch(url, { signal: controller.signal }).finally(function() {
      clearTimeout(timer);
    });
  }

  function readVersion(data) {
    if (!data) return "?";
    if (typeof data.version === "string") return data.version;
    if (data.version && data.version.name) return data.version.name;
    return "?";
  }

  function paintStatus(box, state, info) {
    box.classList.add("open");
    if (state === "checking") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot y"></span>در حال بررسی...</span></div>';
      return;
    }
    if (state === "error") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot r"></span>خطا در اتصال</span></div>';
      return;
    }
    if (state === "offline") {
      box.innerHTML = '<div class="row"><span class="k"><span class="dot r"></span>آفلاین</span></div>';
      return;
    }
    box.innerHTML =
      '<div class="row"><span class="k"><span class="dot g"></span>آنلاین (' + info.proto + ')</span></div>' +
      '<div class="row"><span class="k">پلیر</span><span class="v">' + info.players + '</span></div>' +
      '<div class="row"><span class="k">آی‌پی</span><span class="v">' + info.ip + '</span></div>' +
      '<div class="row"><span class="k">نسخه</span><span class="v">' + info.version + '</span></div>';
  }

  async function checkOne(ip, kind) {
    var url = kind === "bedrock"
      ? "https://api.mcsrvstat.us/bedrock/3/" + ip
      : "https://api.mcsrvstat.us/3/" + ip;
    var res = await fetchWithTimeout(url);
    return await res.json();
  }

  async function checkStatus(server, box, btn) {
    if (btn) btn.disabled = true;
    paintStatus(box, "checking");
    var cleanIp = server.ip.split("/")[0].trim();
    var order = server.t === "bedrock" ? ["bedrock"] : (server.t === "java" ? ["java"] : ["java", "bedrock"]);
    var found = null;
    try {
      for (var i = 0; i < order.length; i++) {
        var data = await checkOne(cleanIp, order[i]);
        if (data && data.online) {
